services:
  mysql:
    image: mysql:8.0
    container_name: receiptai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - receiptai-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: receiptai-backend
    restart: unless-stopped
    ports:
      - "8301:5000"
    environment:
      FLASK_ENV: ${FLASK_ENV}
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      UPLOAD_FOLDER: /app/uploads
    volumes:
      - receipt_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - receiptai-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://Carlos-backend-AI.coeofjrmsu.com
    container_name: receiptai-frontend
    restart: unless-stopped
    ports:
      - "8300:80"
    depends_on:
      - backend
    networks:
      - receiptai-network

volumes:
  mysql_data:
  receipt_uploads:

networks:
  receiptai-network:
    driver: bridge
